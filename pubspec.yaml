name: verdatica_flutter
description: Verdatica - Smart Farming Monitoring App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # HTTP client
  dio: ^5.7.0
  
  # State management
  provider: ^6.1.2
  
  # Secure storage for auth token
  flutter_secure_storage: ^9.2.2
  
  # Camera / image picker
  image_picker: ^1.1.2
  
  # Shared preferences
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

